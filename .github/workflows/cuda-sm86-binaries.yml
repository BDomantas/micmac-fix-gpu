# Per-SM binaries + fat binary + publish (artifacts, Release, GHCR).
#
# CUDA 12.8 devel: MicMac ported to cudaTextureObject_t (no textureReference).
# Fat default SMs: 80 (A100) + 86 + 89 (Ada) + 120 (Blackwell / RTX 5090).
#
# Compile-only on GHA (no GPU). Runtime needs NVIDIA driver on target host.

name: CUDA sm binaries

on:
  push:
    branches:
      - gpu-instream
      - gpu-remaining-features-prbe-h
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      cuda_archs:
        description: "SMs for per-SM matrix AND fat (comma-separated)"
        type: string
        default: "80,86,89,120"
      build_singles:
        description: "Build separate per-SM packages"
        type: boolean
        default: true
      build_fat:
        description: "Build fat multi-SM package"
        type: boolean
        default: true
      publish_release:
        description: "Update GitHub Release cuda-latest"
        type: boolean
        default: true
      push_ghcr:
        description: "Push GHCR images"
        type: boolean
        default: true

concurrency:
  group: cuda-sm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  prepare:
    name: prepare-matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      archs: ${{ steps.set.outputs.archs }}
    steps:
      - name: Build matrix JSON
        id: set
        shell: bash
        env:
          ARCHS_IN: ${{ github.event.inputs.cuda_archs || '80,86,89,120' }}
        run: |
          set -euo pipefail
          ARCHS=$(echo "$ARCHS_IN" | tr ',;/' ' ' | xargs)
          export ARCHS
          echo "SMs: $ARCHS"
          echo "archs=$ARCHS" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,os; archs=os.environ["ARCHS"].split(); m={"include":[{"arch":a,"sm_label":f"sm{a}"} for a in archs]}; open(os.environ["GITHUB_OUTPUT"],"a").write("matrix="+json.dumps(m,separators=(",",":"))+"\n"); print(m)'

  # ---------- per-SM packages (previous good shape) ----------
  build:
    name: build-${{ matrix.sm_label }}
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_singles != 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    defaults:
      run:
        shell: bash
    env:
      CUDA_ARCH: ${{ matrix.arch }}
      CUDA_ARCHS: ${{ matrix.arch }}
      CUDA_HOME: /usr/local/cuda
      DEBIAN_FRONTEND: noninteractive
      JOBS: "4"
    steps:
      - name: Disk report
        run: |
          set -euo pipefail
          command -v bash
          df -h
          nvcc --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install deps
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq bash cmake ninja-build g++ make git rsync \
            libtiff-dev libpng-dev libjpeg-dev zlib1g-dev libexpat1-dev \
            ca-certificates python3 curl
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build + package
        id: build
        run: |
          set -euo pipefail
          chmod +x ci/*.sh
          bash ci/build_cuda_sm86.sh
          ls -lah dist/
          cat dist/*.manifest.json
          TAR=$(ls dist/micmac-gpgpu-sm${CUDA_ARCH}-*.tar.gz | head -1)
          test -f "$TAR"
          echo "tar=$(basename "$TAR")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: micmac-gpgpu-${{ matrix.sm_label }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.manifest.json
          if-no-files-found: error
          retention-days: 90

  # ---------- fat multi-SM (same toolkit; default ON) ----------
  build-fat:
    name: build-fat
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_fat != 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    defaults:
      run:
        shell: bash
    env:
      CUDA_HOME: /usr/local/cuda
      DEBIAN_FRONTEND: noninteractive
      JOBS: "4"
      CUDA_ARCHS: ${{ needs.prepare.outputs.archs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install deps + fat build
        id: build
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq bash cmake ninja-build g++ make git rsync \
            libtiff-dev libpng-dev libjpeg-dev zlib1g-dev libexpat1-dev python3 curl
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x ci/*.sh
          export CUDA_ARCHS
          CUDA_ARCHS=$(echo "$CUDA_ARCHS" | tr ',;/' ' ' | xargs)
          export CUDA_ARCH
          CUDA_ARCH=$(echo "$CUDA_ARCHS" | awk '{print $1}')
          echo "FAT CUDA_ARCH=$CUDA_ARCH CUDA_ARCHS=$CUDA_ARCHS"
          bash ci/build_cuda_sm86.sh
          ls -lah dist/
          cat dist/*.manifest.json
          TAR=$(ls dist/micmac-gpgpu-sm*.tar.gz | head -1)
          test -f "$TAR"
          echo "tar=$(basename "$TAR")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: micmac-gpgpu-fat-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.manifest.json
          if-no-files-found: error
          retention-days: 90

  # ---------- one Release with ALL tarballs ----------
  release:
    name: publish-release
    needs: [prepare, build, build-fat]
    # run even if one of build/build-fat skipped, but not if both failed
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build-fat.result == 'success') &&
      (github.event_name == 'push' || github.event.inputs.publish_release != 'false' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Download per-SM artifacts
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: micmac-gpgpu-sm*-${{ github.sha }}
          merge-multiple: true
      - name: Download fat artifact
        if: needs.build-fat.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: micmac-gpgpu-fat-${{ github.sha }}
          path: artifacts
      - name: List packages
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          test -n "$(find artifacts -name '*.tar.gz' | head -1)"
      - name: Publish Release cuda-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'cuda-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'CUDA mm3d binaries (per-SM + fat)' }}
          body: |
            Rolling CUDA mm3d packages from `${{ github.sha }}` (`${{ github.ref_name }}`).

            ### Per-SM (pick your GPU)
            | SM | GPUs |
            |----|------|
            | sm_80 | A100 |
            | sm_86 | A4500 / Ampere pro |
            | sm_89 | L40S, RTX 5000 Ada, RTX 5880 Ada, RTX PRO 5000 Ada |
| sm_120 | RTX 5090 / Blackwell |

            ### Fat
            One binary with **sm_80 + sm_86 + sm_89 + sm_120** (CUDA 12.8, texture objects).

            | SM | GPUs |
            |----|------|
            | sm_120 | RTX 5090 / Blackwell |

            Multi-GPU (2× cards): one process per GPU (`CUDA_VISIBLE_DEVICES`).
          files: artifacts/**
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- GHCR: one image per SM + fat ----------
  ghcr-sm:
    name: ghcr-${{ matrix.sm_label }}
    needs: [prepare, build]
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.push_ghcr != 'false')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CUDA_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: micmac-gpgpu-${{ matrix.sm_label }}-${{ github.sha }}
          path: artifact
      - name: Unpack + push
        run: |
          set -euo pipefail
          TAR=$(ls artifact/micmac-gpgpu-sm${CUDA_ARCH}-*.tar.gz | head -1)
          mkdir -p unpacked && tar -C unpacked -xzf "$TAR"
          CTX=$(find unpacked -maxdepth 1 -type d -name 'micmac-gpgpu-sm*' | head -1)
          test -x "$CTX/bin/mm3d"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER}/micmac-gpgpu-${{ matrix.sm_label }}"
          SHORT=$(echo '${{ github.sha }}' | cut -c1-12)
          BRANCH_TAG=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          cp ci/Dockerfile.release-sm86 "$CTX/Dockerfile"
          docker build -t "${IMG}:${SHORT}" -t "${IMG}:${{ github.sha }}" -t "${IMG}:${BRANCH_TAG}" -t "${IMG}:latest" "$CTX"
          docker push "${IMG}:${SHORT}"
          docker push "${IMG}:${{ github.sha }}"
          docker push "${IMG}:${BRANCH_TAG}"
          docker push "${IMG}:latest"

  ghcr-fat:
    name: ghcr-fat
    needs: build-fat
    if: |
      always() && needs.build-fat.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.push_ghcr != 'false')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: micmac-gpgpu-fat-${{ github.sha }}
          path: artifact
      - name: Unpack + push fat
        run: |
          set -euo pipefail
          TAR=$(ls artifact/micmac-gpgpu-sm*.tar.gz | head -1)
          mkdir -p unpacked && tar -C unpacked -xzf "$TAR"
          CTX=$(find unpacked -maxdepth 1 -type d -name 'micmac-gpgpu-sm*' | head -1)
          test -x "$CTX/bin/mm3d"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER}/micmac-gpgpu-fat"
          SHORT=$(echo '${{ github.sha }}' | cut -c1-12)
          BRANCH_TAG=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          cp ci/Dockerfile.release-sm86 "$CTX/Dockerfile"
          docker build \
            -t "${IMG}:${SHORT}" \
            -t "${IMG}:${{ github.sha }}" \
            -t "${IMG}:${BRANCH_TAG}" \
            -t "${IMG}:cuda-latest" \
            -t "${IMG}:latest" \
            "$CTX"
          docker push "${IMG}:${SHORT}"
          docker push "${IMG}:${{ github.sha }}"
          docker push "${IMG}:${BRANCH_TAG}"
          docker push "${IMG}:cuda-latest"
          docker push "${IMG}:latest"
